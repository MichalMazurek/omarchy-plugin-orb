name: Release source
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Accepted release tag
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: d21c24b7e91a23c8f88e6daafdc67d8fbf8bb0cf
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "22"
      - run: ./tests/run
      - name: Create accepted annotated tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          RELEASE_COMMIT: d21c24b7e91a23c8f88e6daafdc67d8fbf8bb0cf
        run: |
          set -euo pipefail
          test "$RELEASE_TAG" = v0.1.0
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$RELEASE_COMMIT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            test "$(git cat-file -t "$RELEASE_TAG")" = tag
            test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$RELEASE_COMMIT"
          else
            git tag -a "$RELEASE_TAG" "$RELEASE_COMMIT" -m "Orb $RELEASE_TAG"
            git push origin "refs/tags/$RELEASE_TAG"
          fi
      - run: node scripts/archive.mjs
        env:
          RELEASE_TAG: ${{ inputs.tag }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: source-release
          path: dist/*
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --draft --title "Orb $RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
